# ================================
# Thruster / Control
# ================================
base_thrust: 1600      # 직진 기본 PWM
pwm_min: 1100           # PWM 하한 (안전)
pwm_max: 1900          # PWM 상한 (안전)
diff_max: 500         # 좌/우 최대 차등 PWM

# ================================
# 회피 로직 (simple_avoid 전용)
# ================================
forward_axis_sign: 1   # +x가 전방이면 1, -x가 전방이면 -1
obs_range: 2.2         # [m] 회피 고려 반경
obs_margin: 0.15       # [m] 장애물 팽창 여유
max_angle_deg: 100.0   # [deg] 전방 부채꼴(좌우)
pow_gain: 1.6          # 거리 가중 지수(가까울수록 영향↑)
steer_gain: 1.0        # 각도 바이어스 스케일
forward_bias: 0.6      # 정면 가중(0~1, 1에 가까울수록 정면 장애물에 더 민감)

# ================================
# 실행 루프
# ================================
rate: 10               # 루프 주기 [Hz]

# ================================
# GNSS (gnss_converter용)
# ================================
origin: [37.450729, 126.6523893, 43.412]  # latitude, longitude, altitude (GNSS 원점)
