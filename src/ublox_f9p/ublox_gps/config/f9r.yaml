# Configuration Settings for C94-M8P device

# debug: 1                    # Range 0-4 (0 means no debug statements will print)

# save:
#   mask: 3103                # Save I/O, Message, INF Message, Nav, Receiver 
#                             # Manager, Antenna, and Logging Configuration
#   device: 4                 # Save to EEPROM

# device: /dev/ttyACM0
# frame_id: m8u 
# rate: 4                     # in Hz
# nav_rate: 4                 # [# of measurement cycles], recommended 1 Hz, may 
#                             # be either 5 Hz (Dual constellation) or 
#                             # 8 Hz (GPS only)
# dynamic_model: 0    # Airborne < 2G, 2D fix not supported (3D only), 
#                             # Max Alt: 50km
#                             # Max Horizontal Velocity: 250 m/s, 
#                             # Max Vertical Velocity: 100 m/s
# fix_mode: 3 
# enable_ppp: true           # Not supported by C94-M8P
# dr_limit: 1

# uart1:
#   baudrate: 115200           # C94-M8P specific
#   in: 16                    # RTCM 3
#   out: 16                    # No UART out for rover

# gnss:
#   glonass: true             # Supported by C94-M8P
#   beidou: false             # Supported by C94-M8P
#   qzss: false               # Supported by C94-M8P

# dgnss_mode: 3               # Fixed mode

# inf: 
#   all: true                   # Whether to display all INF messages in console

# # Enable u-blox message publishers
# publish:
#   all: true
#   esf: true
#   aid:
#     hui: false
#   nav:
#     posecef: false


# zed-f9r.yaml (로버 전용)
debug: 1
device: /dev/ttyGPS
frame_id: gps

# 시작 시 위험한 CFG 최소화
config_on_startup: true      # u-center에서 큰 틀을 저장해두셨다면 false로 둬도 무방
# set_baudrate: false        # 드라이버가 지원하면 포트/baud는 건드리지 않기 권장

rate:
  meas: 100   # 5 Hz
  nav: 1 

dynamic_model: automotive
fix_mode: auto

# RTK는 '입력'만 필요
rtcm:
  in: true
  out: false

usb:
  in:  19    # RTCM3 수신 허용 (필수)
  out: 1                # 필요 시 nmea 추가


publish:
  all: false
  nav:
    all: true
    pvt: true
    sat: true
    status: true
    relposned: true          # carrSoln(0/1/2) 확인용
  hnr:
    pvt: true                # 드라이버가 지원 시
  esf:
    status: true
    alg: true
    meas: false              # 처음엔 OFF; 필요 시 켜세요
